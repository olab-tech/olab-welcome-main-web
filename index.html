<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Basic Meta Tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 
        ============================================================
        PRIMARY SEO & BRANDING
        ============================================================
    -->

    <!-- Title: The most important SEO tag. Clear, benefit-driven, and includes your brand. (Approx. 60 characters) -->
    <title>Boost Shopify Sales | Expert Store Optimization | Olab Technologies</title>

    <!-- Description: Your "ad copy" on Google. Compelling, includes keywords, and encourages clicks. (Approx. 155 characters) -->
    <meta name="description"
        content="Is your Shopify store underperforming? Olab Technologies specializes in fixing sales funnels, optimizing for speed, and driving daily revenue. Stop flagging, start selling.">

    <!-- Canonical URL: Tells Google the "master" version of this page to avoid duplicate content issues. -->
    <!-- IMPORTANT: Update this to your final domain when you go live. -->
    <link rel="canonical" href="https://www.olab-tech.com/">

    <!-- Favicons: For browser tabs, bookmarks, and mobile home screens. -->
    <!-- Place your icons in the root directory for best practice. -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">


    <!-- 
        ============================================================
        SOCIAL MEDIA SHARING (Open Graph & Twitter Cards)
        ============================================================
    -->

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.olab-tech.com/">
    <meta property="og:title" content="We Fix Shopify Stores That Don't Make Sales.">
    <meta property="og:description"
        content="Olab Technologies specializes in fixing sales funnels, optimizing for speed, and driving daily revenue. Stop flagging, start selling.">
    <!-- IMPORTANT: The OG image is crucial. Use a 1200x630px image that visually represents your headline. -->
    <meta property="og:image" content="https://www.olab-tech.com/social-preview.jpg">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://www.olab-tech.com/">
    <meta name="twitter:title" content="We Fix Shopify Stores That Don't Make Sales.">
    <meta name="twitter:description"
        content="Olab Technologies specializes in fixing sales funnels, optimizing for speed, and driving daily revenue. Stop flagging, start selling.">
    <!-- IMPORTANT: Use the same high-quality image for Twitter as for Open Graph. -->
    <meta name="twitter:image" content="https://www.olab-tech.com/social-preview.jpg">
    <!-- Optional: Add your Twitter handle -->
    <!-- <meta name="twitter:site" content="@YourTwitterHandle"> -->


    <!-- 
        ============================================================
        FONTS & STYLESHEETS
        ============================================================
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Assuming you are using Tailwind CSS CDN for this project based on previous requests -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Your Custom Stylesheet (if any) -->
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>

<body>
    <div class="wrapper">
        <div class="content">
            <img src="icon/2.png" alt="Olab One Logo" class="logo" style="width: 190px;">

            <h1>If your Shopify store isn’t making daily sales that’s a 🚩 We fix that.</h1>

            <p class="subtitle">
                We’re working behind the scenes!
                Our website is getting its final touches and will be live very soon.
                Thank you for your patience — exciting things are coming! 🚀
            </p>

            <div class="countdown">
                <h2>SOON</h2>
            </div>


            <div class="footer">
                <p>A new product from the team at <a href="https://olab-tech.com" target="_blank">Olab Tech</a></p>
            </div>
        </div>
    </div>

    <script defer src="./script.js"></script>
</body>

</html>
